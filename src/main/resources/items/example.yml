# ═══════════════════════════════════════════════════
# HaoHanItemCore — Example Items
# ═══════════════════════════════════════════════════
# 
# Mỗi top-level key là namespace.
# Sub-keys là item key.
# ID cuối cùng = namespace:item_key
#
# Ví dụ: example:fire_crystal → ID = "example:fire_crystal"
#
# Các field hỗ trợ:
#   material:         (bắt buộc) Bukkit Material name
#   display-name:     (tùy chọn) Tên hiển thị, hỗ trợ § color codes
#   lore:             (tùy chọn) Danh sách các dòng lore
#   custom-model-data:(tùy chọn) Custom model data number
#   max-stack-size:   (tùy chọn) Số lượng tối đa trong 1 stack (mặc định 64)
#   type:             (tùy chọn) MATERIAL, TOOL, WEAPON, ARMOR, FOOD,
#                                MACHINE_COMPONENT, CURRENCY, SPECIAL
#   properties:       (tùy chọn) Map các property tùy ý
# ═══════════════════════════════════════════════════

example:
  fire_crystal:
    material: EMERALD
    display-name: "§cFire Crystal"
    lore:
      - "§7A crystal containing"
      - "§7unstable fire energy."
    custom-model-data: 1001
    max-stack-size: 16
    type: MATERIAL
    properties:
      element: fire
      tier: 1

  mana_shard:
    material: PRISMARINE_SHARD
    display-name: "§bMana Shard"
    lore:
      - "§7A shard infused with"
      - "§7pure mana energy."
    custom-model-data: 1002
    max-stack-size: 64
    type: MATERIAL
    properties:
      element: mana

  mana_crystal:
    material: DIAMOND
    display-name: "§9Mana Crystal"
    lore:
      - "§7A powerful crystal"
      - "§7condensed from mana shards."
    custom-model-data: 1003
    max-stack-size: 16
    type: MATERIAL
    properties:
      element: mana
      tier: 2

  steel_core:
    material: IRON_NUGGET
    display-name: "§7Steel Core"
    lore:
      - "§7A dense core made from"
      - "§7compressed iron."
    custom-model-data: 2001
    max-stack-size: 64
    type: MACHINE_COMPONENT

  steel_plate:
    material: IRON_INGOT
    display-name: "§fSteel Plate"
    lore:
      - "§7A reinforced plate"
      - "§7used in machine construction."
    custom-model-data: 2002
    max-stack-size: 64
    type: MACHINE_COMPONENT

  copper_casing:
    material: BARRIER
    display-name: "§6Copper Casing"
    lore:
      - "§7A sturdy reinforced copper block casing."
    type: BLOCK
    max-stack-size: 64
    properties:
      custom_block_id: "example:copper_casing"
      custom_block_model: "minecraft:copper_block"
      custom_block_drop: "example:copper_casing"
      custom_block_sounds:
        place: "minecraft:block.copper.place"
        break: "minecraft:block.copper.break"
        hit: "minecraft:block.copper.hit"
        step: "minecraft:block.copper.step"

  ruby_ore:
    material: BARRIER
    display-name: "§cRuby Ore"
    lore:
      - "§7A rare deepslate ore infused with ruby crystals."
    type: BLOCK
    max-stack-size: 64
    properties:
      custom_block_id: "example:ruby_ore"
      custom_block_model: "minecraft:deepslate_redstone_ore"
      custom_block_drop: "example:ruby_ore"
      custom_block_sounds:
        place: "minecraft:block.deepslate.place"
        break: "minecraft:block.deepslate.break"
        hit: "minecraft:block.deepslate.hit"
        step: "minecraft:block.deepslate.step"

  # Ví dụ Overwrite block gốc Minecraft (không dùng Barrier hay Block Display):
  diamond_ore_overwrite:
    material: DIAMOND_ORE
    display-name: "§bDiamond Ore"
    type: BLOCK
    properties:
      custom_block_id: "minecraft:diamond_ore"
      custom_block_tool_type: "PICKAXE"
      custom_block_required_tier: "netherite"
      custom_block_hardness: 6.0
      custom_block_drop: "minecraft:diamond"

# Ví dụ Overwrite item gốc Minecraft (Cúp kim cương được ghi đè Tier và Lore):
minecraft:
  diamond_pickaxe:
    material: DIAMOND_PICKAXE
    display-name: "§bDiamond Pickaxe"
    lore:
      - "§8Tier: §c6 (Diamond)"
      - "§7Vật phẩm game gốc đã được thiết lập thông số."
    type: TOOL
    tool_type: PICKAXE
    tier: 6
    mining_speed: 8.0
    properties:
      max_damage: 1561



