# HaoHanItemCore Configuration
# Plugin nền tảng quản lý Custom Item & Recipe

# Bật debug logging
debug: false

# Tự động load items từ thư mục items/
auto-discover-items: true

# Tự động load recipes từ thư mục recipes/
auto-discover-recipes: true

# Cấu hình tối ưu hiển thị Custom Block (ItemDisplay)
custom-blocks:
  culling:
    # Bán kính hình cầu tối đa nhận ItemDisplay (blocks)
    spherical-radius: 32
    # Khoảng cách đệm despawn chống rung giật biên (blocks)
    hysteresis-margin: 4
