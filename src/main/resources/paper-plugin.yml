name: HaoHanItemCore
version: '${project.version}'
main: vn.haohan.itemcore.HaoHanItemCorePlugin
description: Centralized Custom Item and Recipe Management Engine for HaoHan SMP
api-version: '1.21'
author: HaoHan
website: https://github.com/Hao-Han-SMP/HaoHanItemCore

permissions:
  haohanitemcore.admin:
    description: Allows using all /im (HaoHanItemCore) commands
    default: op

dependencies:
  server:
    packetevents:
      load: BEFORE
      required: true
      join-classpath: true

