name: HaoHanItemCore
version: '${project.version}'
main: vn.haohan.itemcore.HaoHanItemCorePlugin
description: Centralized Custom Item and Recipe Management Engine for HaoHan SMP
api-version: '1.21'
author: HaoHan
website: https://github.com/Hao-Han-SMP/HaoHanItemCore

permissions:
  haohanitemcore.use:
    description: Allows basic HaoHanItemCore commands (items, item, recipes, recipe, search, browse)
    default: true
  haohanitemcore.admin:
    description: Allows admin HaoHanItemCore commands (give, reload)
    default: op
    children:
      haohanitemcore.use: true
